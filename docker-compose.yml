services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./dataset:/app/dataset  

    networks:
      - hackathon

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # Inside the docker network, "backend" resolves via the service name below.
      - VITE_API_PROXY_TARGET=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - hackathon

networks:
  hackathon:
    driver: bridge
